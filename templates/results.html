<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5 text-center">
    <div class="bg-white p-5 rounded shadow-sm">
        <h1 class="mb-4">🎉 Rezultāti</h1>
        {% for party, result in results.items() %}
        <p class="fs-4">Jums vislabāk atbilst <strong>{{ party }}</strong> ar {{ result.percentage }}% atbilstību!</p>
        <p>{{ result.info }}</p>
        {% endfor %}
        <a href="/" class="btn btn-outline-secondary mt-3">Pārbaudīt vēlreiz</a>
    </div>
</div>
</body>
</html>

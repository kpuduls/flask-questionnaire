<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rezultāti</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="container py-5 text-center">
    <div class="bg-white p-5 rounded shadow-sm">
        <h1 class="mb-4">🎉 Rezultāti</h1>
        <p class="fs-4">Jums vislabāk atbilst <strong>{{ best_party }}</strong> ar {{ best_party_result }}% atbilstību!</p>

        <!-- Attēlojam diagrammu -->
        <canvas id="resultsChart" width="400" height="400"></canvas>

        <a href="/" class="btn btn-outline-secondary mt-3">Pārbaudīt vēlreiz</a>
    </div>
</div>

<script>
    // Simulated data from Flask — replace with actual injected data in production
    const resultsJson = '{"JV": 25.0, "LPV": 50.0, "P": 25.0}';

    // Parse the JSON safely
    let resultsData;
    try {
        resultsData = JSON.parse(resultsJson.trim());
    } catch (error) {
        document.getElementById('chart-container').innerText = 'Datu kļūda: nevar parsēt rezultātus.';
        throw new Error("JSON parsing failed: " + error.message);
    }

    // Show parsed data on page for debugging
    const dataDisplay = document.createElement('pre');
    dataDisplay.textContent = 'Izparsētie dati:\n' + JSON.stringify(resultsData, null, 2);
    document.body.insertBefore(dataDisplay, document.getElementById('chart-container'));

    // Extract data
    const labels = Object.keys(resultsData);
    const percentages = labels.map(label => resultsData[label]);

    // Render pie chart
    const ctx = document.getElementById('resultsChart').getContext('2d');
    new Chart(ctx, {
        type: 'pie',
        data: {
            labels: labels,
            datasets: [{
                label: 'Atbilstība (%)',
                data: percentages,
                backgroundColor: ['#ff9999', '#66b3ff', '#99ff99'],
                borderColor: '#ffffff',
                borderWidth: 1
            }]
        },
        options: {
            responsive: true
        }
    });
</script>



</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rezultāti</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
<div class="container py-5 text-center">
    <div class="bg-white p-5 rounded shadow-sm">
        <h1 class="mb-4">🎉 Rezultāti</h1>

        <!-- Display results for the best fitting party -->
        <h3 class="mb-4">Jums vislabāk atbilst <strong>{{ best_party }}</strong> ar {{ best_party_result.percentage }}% atbilstību!</h3>
        <p>{{ best_party_result.info }}</p>

        <!-- Hidden div to store results data as a JSON string -->
        <div id="results-data" data-results="{{ results | tojson }}"></div>

        <!-- Pie chart for all parties -->
        <canvas id="resultsChart" width="400" height="400"></canvas>

        <a href="/" class="btn btn-outline-secondary mt-3">Pārbaudīt vēlreiz</a>
    </div>
</div>

<script>
    // Retrieve the results data from the data-results attribute
    const results = JSON.parse(document.getElementById('results-data').getAttribute('data-results'));

    const labels = Object.keys(results);  // Party names
    const percentages = labels.map(party => results[party].percentage);  // Percentage values

    const ctx = document.getElementById('resultsChart').getContext('2d');

    const chart = new Chart(ctx, {
        type: 'pie',  // Pie chart
        data: {
            labels: labels,
            datasets: [{
                label: 'Atbilstība',
                data: percentages,
                backgroundColor: ['#ff9999', '#66b3ff', '#99ff99'], // Colors for the pie sections
                hoverOffset: 4
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: 'top',
                },
                tooltip: {
                    callbacks: {
                        label: function(tooltipItem) {
                            let party = tooltipItem.label;
                            let percentage = tooltipItem.raw;
                            return `${party}: ${percentage}%`;
                        }
                    }
                }
            }
        }
    });
</script>
</body>
</html>

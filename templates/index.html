<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Questionnaire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <h1 class="mb-4 text-center">📝 Simple Questionnaire</h1>
    <form action="/results" method="post" class="bg-white p-4 rounded shadow-sm">
        {% for question in questions %}
        <div class="mb-4">
            <h5>{{ loop.index }}. {{ question.question }}</h5>
            {% for option in question.options %}
            <div class="form-check">
                <input class="form-check-input" type="radio" name="{{ question.question }}" value="{{ option }}" required>
                <label class="form-check-label">{{ option }}</label>
            </div>
            {% endfor %}
        </div>
        {% endfor %}
        <div class="text-center">
            <button type="submit" class="btn btn-primary">Submit Answers</button>
        </div>
    </form>
</div>
</body>
</html>
